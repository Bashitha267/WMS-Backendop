[global]
error_log = /proc/self/fd/2
log_level = warning

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

; ondemand worker pool: workers are only spawned when a request arrives,
; and are killed after 10s idle, keeping idle RAM at ~30MB.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500

access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
