services:
  - type: web
    name: wms-backend
    env: docker
    plan: free
    region: frankfurt # Tip: Select the same region where your Aiven MySQL is hosted!
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false # Set in Render Dashboard
      - key: DB_PORT
        sync: false # Set in Render Dashboard
      - key: DB_DATABASE
        sync: false # Set in Render Dashboard
      - key: DB_USERNAME
        sync: false # Set in Render Dashboard
      - key: DB_PASSWORD
        sync: false # Set in Render Dashboard
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "false"
